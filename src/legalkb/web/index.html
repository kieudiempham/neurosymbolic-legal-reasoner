<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hỏi đáp pháp luật</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #6b7385; --line: #e3e6ec;
    --user: #2f5bd3; --user-text: #ffffff; --yes: #1f8a4c; --no: #c0392b; --unknown: #b7791f; --law: #5a4fcf;
    --code: #f1f3f7;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.55 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  header { padding: 14px 20px; background: var(--panel); border-bottom: 1px solid var(--line);
           display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  header h1 { margin: 0; font-size: 17px; }
  header .sub { color: var(--muted); font-size: 13px; }
  main { max-width: 900px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column;
         height: calc(100vh - 62px); }
  #log { flex: 1; overflow-y: auto; padding: 4px 2px 12px; }
  .msg { margin: 10px 0; display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble { max-width: 82%; padding: 10px 14px; border-radius: 14px; background: var(--panel);
            border: 1px solid var(--line); white-space: pre-wrap; }
  .msg.user .bubble { background: var(--user); color: var(--user-text); border-color: var(--user); }
  .badges { margin-bottom: 6px; display: flex; flex-wrap: wrap; gap: 6px; }
  .badge { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; color: #fff; }
  .badge.yes { background: var(--yes); } .badge.no { background: var(--no); }
  .badge.unknown { background: var(--unknown); } .badge.law { background: var(--law); }
  .ask-more { margin-top: 8px; padding: 8px 10px; border-radius: 8px; background: #fff6e5;
              border: 1px solid #f3d9a4; font-size: 14px; white-space: normal; }
  details { margin-top: 8px; white-space: normal; }
  summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .detail { font-size: 13px; margin-top: 6px; }
  .detail h4 { margin: 10px 0 4px; font-size: 13px; }
  code, .tree { font-family: Consolas, "Courier New", monospace; font-size: 12px; }
  .facts code { display: inline-block; background: var(--code); padding: 1px 6px; border-radius: 4px; margin: 2px; }
  .tree ul { list-style: none; margin: 0; padding-left: 16px; border-left: 1px dashed var(--line); }
  .tree > ul { padding-left: 0; border-left: none; }
  .tree li { margin: 2px 0; }
  .k { font-family: inherit; font-size: 11px; padding: 0 5px; border-radius: 4px; margin-left: 4px; }
  .k.rule { background: #e9e7fb; color: var(--law); } .k.fact { background: #e5f4ea; color: var(--yes); }
  .k.missing { background: #fff1d6; color: var(--unknown); } .k.presumed_absent { background: #eef0f4; color: var(--muted); }
  .basis { margin: 4px 0; padding: 6px 8px; background: var(--code); border-radius: 6px; }
  .meta { margin-top: 6px; font-size: 12px; color: var(--muted); }
  .meta a { color: var(--muted); }
  form { display: flex; gap: 8px; padding-top: 10px; border-top: 1px solid var(--line); }
  textarea { flex: 1; resize: none; height: 64px; padding: 10px; border: 1px solid var(--line); border-radius: 10px;
             font: inherit; background: var(--panel); color: var(--text); }
  button { border: 0; border-radius: 10px; padding: 0 16px; font: inherit; cursor: pointer; }
  #send { background: var(--user); color: #fff; }
  #new { background: var(--panel); border: 1px solid var(--line); color: var(--text); padding: 8px 12px; }
  .examples { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 10px; }
  .examples button { background: var(--panel); border: 1px solid var(--line); padding: 6px 10px; font-size: 13px;
                     color: var(--text); text-align: left; }
  .typing { color: var(--muted); font-style: italic; }
  #trace { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; padding: 30px; }
  #trace .box { max-width: 1000px; height: 100%; margin: 0 auto; background: var(--panel); border-radius: 12px;
                display: flex; flex-direction: column; }
  #trace .bar { display: flex; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  #trace pre { margin: 0; padding: 14px; overflow: auto; flex: 1; font-size: 12px; }
</style>
</head>
<body>
<header>
  <div><h1>Hỏi đáp pháp luật (neuro-symbolic)</h1>
    <div class="sub">Đọc câu hỏi → suy luận trên luật → trả lời có căn cứ, hoặc hỏi lại khi thiếu thông tin</div></div>
  <button id="new" title="Bắt đầu câu hỏi mới">Câu hỏi mới</button>
</header>
<main>
  <div id="log">
    <div class="examples" id="examples"></div>
  </div>
  <form id="form">
    <textarea id="input" placeholder="Nhập câu hỏi (Enter để gửi, Shift+Enter xuống dòng)…"></textarea>
    <button id="send" type="submit">Gửi</button>
  </form>
</main>
<div id="trace"><div class="box"><div class="bar"><b id="trace-title">Trace</b>
  <button onclick="document.getElementById('trace').style.display='none'">Đóng</button></div><pre id="trace-body"></pre></div></div>
<script>
const EXAMPLES = [
  "Tôi làm việc cho công ty theo hợp đồng lao động không xác định thời hạn, lương 10 triệu một tháng. Tôi có phải đóng bảo hiểm xã hội bắt buộc không, mỗi tháng đóng bao nhiêu?",
  "Tôi ký hợp đồng lao động với công ty, lương 8 triệu. Tôi có thuộc diện bảo hiểm xã hội bắt buộc không?",
  "Bố tôi đang hưởng lương hưu và vẫn đi làm theo hợp đồng lao động không xác định thời hạn. Bố tôi có thuộc diện tham gia bảo hiểm xã hội bắt buộc không?",
  "Điều kiện để người lao động thuộc diện tham gia bảo hiểm xã hội bắt buộc là gì?",
];
let session = null;
const log = document.getElementById("log"), input = document.getElementById("input");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const KIND = {rule: "luật", fact: "sự kiện", missing: "thiếu", presumed_absent: "giả định không có"};

function add(cls, html) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.innerHTML = `<div class="bubble">${html}</div>`;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}

function tree(node) {
  const label = `<code>${esc(node.goal)}</code>` +
    (node.kind ? `<span class="k ${node.kind}">${KIND[node.kind] || node.kind}${node.norm && node.norm !== "derived" ? " " + esc(node.norm) : ""}</span>` : "");
  const kids = (node.children || []).map(tree).join("");
  return `<li>${label}${kids ? `<ul>${kids}</ul>` : ""}</li>`;
}

function details(out) {
  let h = `<div class="detail"><h4>Dữ kiện đọc từ câu hỏi</h4><div class="facts">` +
    out.facts.map(f => `<code>${esc(f)}</code>`).join("") +
    out.false_facts.map(f => `<code>KHÔNG ${esc(f)}</code>`).join("") + `</div>`;
  out.parts.forEach((p, i) => {
    h += `<h4>Ý ${i + 1}: ${esc(p.type)}${p.kind === "case" ? ` — truy vấn <code>${esc(p.goal)}</code>` : " (tra luật)"}</h4>`;
    if (p.kind === "law") {
      p.norms.forEach(n => h += `<div class="basis"><b>${esc(n.unit)}</b> (${esc(n.modality)}): nếu <code>${esc(n.conditions.join(" VÀ ") || "-")}</code> thì <code>${esc(n.head)}</code><br>«${esc(n.text)}»</div>`);
      return;
    }
    [...p.answers.map(a => ["Chứng minh", a]), ...p.contrary.map(a => ["Chứng minh điều ngược lại", a])].forEach(([lab, a]) => {
      h += `<div><b>${lab}</b> (${a.status === "certain" ? "chắc chắn" : "có điều kiện"})` +
        (a.missing.length ? ` — thiếu: <code>${esc(a.missing.join("; "))}</code>` : "") +
        `</div><div class="tree"><ul>${tree(a.proof)}</ul></div>` +
        a.basis.map(b => `<div class="basis"><b>${esc(b.unit)}</b>: «${esc(b.text)}»</div>`).join("");
    });
    if (!p.answers.length && !p.contrary.length) h += `<div>Không có quy phạm nào trong cơ sở tri thức dẫn tới điều được hỏi.</div>`;
  });
  return h + `</div>`;
}

function render(out) {
  if (out.error && !out.answer) return add("bot", `<b>Lỗi:</b> ${esc(out.error)}`);
  const badges = out.parts.map(p => p.kind === "law" ? `<span class="badge law">tra luật</span>`
    : `<span class="badge ${p.verdict}">${esc(p.verdict_vi)}</span>`).join("");
  const more = out.needs_more ? `<div class="ask-more">Hệ thống cần thêm thông tin. Hãy trả lời ngay bên dưới (câu trả lời sẽ được ghép vào câu hỏi), hoặc bấm “Câu hỏi mới”.</div>` : "";
  add("bot", `<div class="badges">${badges}</div>${esc(out.answer)}${more}` +
    `<details><summary>Chi tiết suy luận</summary>${details(out)}</details>` +
    `<div class="meta">run ${out.run_id} · lượt ${out.turn} · <a href="#" onclick="showTrace(${out.run_id});return false">xem trace</a></div>`);
}

async function send(text) {
  if (!text.trim()) return;
  document.getElementById("examples").style.display = "none";
  add("user", esc(text));
  const wait = add("bot", `<span class="typing">Đang đọc câu hỏi và suy luận…</span>`);
  try {
    const r = await fetch("/api/chat", {method: "POST", headers: {"Content-Type": "application/json"},
                                        body: JSON.stringify({session_id: session, message: text})});
    const out = await r.json();
    wait.remove();
    if (out.session_id) session = out.session_id;
    render(out);
  } catch (e) { wait.remove(); add("bot", `<b>Lỗi kết nối:</b> ${esc(e)}`); }
}

async function showTrace(run) {
  const t = await (await fetch(`/api/run/${run}`)).text();
  document.getElementById("trace-title").textContent = `Trace run ${run}`;
  document.getElementById("trace-body").textContent = t;
  document.getElementById("trace").style.display = "block";
}

document.getElementById("form").onsubmit = e => { e.preventDefault(); const t = input.value; input.value = ""; send(t); };
input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); document.getElementById("form").requestSubmit(); } });
document.getElementById("new").onclick = async () => {
  if (session) await fetch("/api/reset", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({session_id: session})});
  add("bot", `<span class="typing">— Câu hỏi mới —</span>`);
};
const ex = document.getElementById("examples");
EXAMPLES.forEach(q => { const b = document.createElement("button"); b.textContent = q; b.onclick = () => send(q); ex.appendChild(b); });
</script>
</body>
</html>
