# Patches to the LLM-reviewed BHXH KB, found by running the KB on the gold of data/dataset/bhxh_v1.
# Every entry states its legal source and why it is needed; these are the only hand edits to the reviewed KB.

remove_all_auto_exception_of: true   # the 22 auto-resolved exception_of pairs were wrong (e.g. foreign rule as exception of the citizen rule)

remove_rules:
  - id: LAB-10-D2-010
    reason: "Điều 2.1.m giao Chính phủ quy định; điều kiện cụ thể do NĐ 158 Điều 3.2 quy định (LAB-11-D3-002/003). Rule gốc quá rộng."
  - id: LAB-10-D2-000
    reason: "Thay bằng cầu nối covered_point_a (P-A1) + LAB-11-D3-000 để các Điều 33/64/70 dùng được covered_point_a."
  - id: LAB-10-D2-000-s1
    reason: "Như trên (P-A1b)."
  - id: LAB-10-D2-000-s2
    reason: "Như trên (P-A2)."

add_rules:
  # --- cầu nối đối tượng (Điều 2 khoản 1, khoản 2) ---
  - id: P-A1
    premises: [~foreign_citizen, signed_labor_contract, term_at_least_1_month]
    conclusion: covered_point_a
    source: "10_bao_hiem_xa_hoi_41_2024_QH15, Điều 2 khoản 1 điểm a"
    reason: "cầu nối: không rule nào suy ra covered_point_a"
  - id: P-A1b
    premises: [~foreign_citizen, signed_labor_contract, indefinite_term_contract]
    conclusion: covered_point_a
    source: "10_bao_hiem_xa_hoi_41_2024_QH15, Điều 2 khoản 1 điểm a"
    reason: "cầu nối, HĐLĐ không xác định thời hạn"
  - id: P-A2
    premises: [~foreign_citizen, alternative_work_agreement, paid_wage, under_management, term_at_least_1_month]
    conclusion: covered_point_a
    source: "10_bao_hiem_xa_hoi_41_2024_QH15, Điều 2 khoản 1 điểm a"
    reason: "cầu nối, thỏa thuận tên gọi khác"
  - id: P-N1
    premises: [~foreign_citizen, enterprise_manager, ~receives_salary]
    conclusion: covered_point_n
    source: "10_bao_hiem_xa_hoi_41_2024_QH15, Điều 2 khoản 1 điểm n"
    reason: "cầu nối: không rule nào suy ra covered_point_n"
  - id: P-K2
    premises: [foreign_citizen, signed_labor_contract, term_at_least_12_months]
    conclusion: covered_art2_khoan2
    source: "10_bao_hiem_xa_hoi_41_2024_QH15, Điều 2 khoản 2"
    reason: "cầu nối cho Điều 70 khoản 2"
  - id: P-K1a
    premises: [covered_point_a]
    conclusion: covered_art2_khoan1
    source: "10_bao_hiem_xa_hoi_41_2024_QH15, Điều 2 khoản 1"
    reason: "cầu nối cho Điều 70 khoản 1"
  - id: P-K1h
    premises: [~foreign_citizen, mandatory_si_history]
    conclusion: covered_art2_khoan1
    source: "10_bao_hiem_xa_hoi_41_2024_QH15, Điều 2 khoản 1"
    reason: "người từng tham gia BHXH bắt buộc theo khoản 1 (predicate của dataset)"
  - id: P-PEN
    premises: [covered_art2_khoan1, stopped_working, contribution_15_years, reached_retirement_age]
    conclusion: entitled_pension
    source: "10_bao_hiem_xa_hoi_41_2024_QH15, Điều 64 khoản 1 điểm a"
    reason: "Điều 64.1 áp dụng chung cho các điểm a, b, c, g, h, i, k, l, m, n khoản 1 Điều 2"
  # --- ngoại lệ thuộc diện (Điều 2 khoản 7; NĐ 158 Điều 3 khoản 5) ---
  - id: P-X-MB
    premises: [monthly_benefit]
    conclusion: ~compulsory_si
    source: "10_bao_hiem_xa_hoi_41_2024_QH15, Điều 2 khoản 7 điểm a"
    reason: "vế 'trợ cấp BHXH, trợ cấp hằng tháng' chưa có rule"
  - id: P-X-PT
    premises: [covered_point_a, part_time, ~wage_at_least_min_base]
    conclusion: ~compulsory_si
    source: "11_nghi_dinh_158_2025_ND-CP, Điều 3 khoản 5"
    reason: "không trọn thời gian, lương dưới mức thấp nhất: không thuộc diện"
  - id: P-X-PR
    premises: [probation_only]
    conclusion: ~compulsory_si
    source: "11_nghi_dinh_158_2025_ND-CP, Điều 3 khoản 5"
    reason: "hợp đồng thử việc: không thuộc diện"
  - id: P-X-HB
    premises: [is_business_owner, business_registered, ~declaration_tax_method, date_before_2029]
    conclusion: ~compulsory_si
    source: "11_nghi_dinh_158_2025_ND-CP, Điều 3 khoản 2 điểm b"
    reason: "a contrario: chủ hộ không nộp thuế kê khai chỉ tham gia từ 01/7/2029"
  # --- nghĩa vụ đóng trong tháng (Điều 33) ---
  - id: P-M1
    premises: [compulsory_si]
    conclusion: must_contribute_month
    source: "10_bao_hiem_xa_hoi_41_2024_QH15, Điều 33"
    reason: "quy tắc chung: thuộc diện thì đóng hằng tháng; chưa có rule"
  - id: P-M2
    premises: [covered_point_a, unpaid_14_days, agreed_contribution]
    conclusion: must_contribute_month
    source: "10_bao_hiem_xa_hoi_41_2024_QH15, Điều 33 khoản 5"
    reason: "trừ trường hợp có thỏa thuận đóng tháng đó"
  # --- nhiều hợp đồng (Điều 2 khoản 5 điểm a) ---
  - id: P-C1
    premises: [signed_labor_contract, multiple_contracts, first_contract_suspended, ~agreed_contribution]
    conclusion: ~contribute_at_first_contract
    source: "10_bao_hiem_xa_hoi_41_2024_QH15, Điều 2 khoản 5 điểm a"
    reason: "HĐ làm căn cứ đang tạm hoãn, không thỏa thuận đóng: tham gia theo HĐ có hiệu lực tiếp theo"

# ngoại lệ đánh bại mọi rule kết luận ngược lại (mở rộng tự động khi build)
exception_over_all:
  - {exception: LAB-10-D2-100}   # đang hưởng lương hưu
  - {exception: P-X-MB}          # trợ cấp BHXH, trợ cấp hằng tháng
  - {exception: LAB-10-D2-101}   # giúp việc gia đình
  - {exception: P-X-PR}          # thử việc
  - {exception: LAB-11-D3-005}   # trợ cấp mất sức lao động hằng tháng

add_exception_of:
  - [P-X-PT, LAB-11-D3-000]            # bán thời gian lương thấp là ngoại lệ của điểm a
  - [LAB-10-D2-011, LAB-10-D2-005]     # NN đủ tuổi nghỉ hưu khi ký HĐ
  - [LAB-10-D2-011-s1, LAB-10-D2-005]  # NN di chuyển nội bộ
  - [LAB-10-D2-011-s2, LAB-10-D2-005]  # điều ước quốc tế
  - [LAB-10-D2-011, LAB-11-D3-000-s10]
  - [LAB-10-D2-011-s1, LAB-11-D3-000-s10]
  - [LAB-10-D2-011-s2, LAB-11-D3-000-s10]
  - [LAB-10-D2-102, LAB-11-D3-002]     # chủ hộ đủ tuổi nghỉ hưu
  - [LAB-10-D2-102, LAB-11-D3-003]
  - [LAB-10-D33-002, P-M1]             # không lương >= 14 ngày, không thỏa thuận
  - [P-C1, LAB-10-D2-013]              # HĐ đầu tạm hoãn
