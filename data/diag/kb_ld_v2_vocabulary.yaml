predicates:
  agreed_otherwise_on_retirement:
    ask: Hai bên có thỏa thuận khác về việc người lao động tiếp tục làm việc khi đủ
      tuổi nghỉ hưu không?
    kind: input
    template_neg: Các bên không có thỏa thuận khác về việc đủ tuổi nghỉ hưu.
    template_pos: Các bên có thỏa thuận khác về việc tiếp tục làm việc khi đủ tuổi
      nghỉ hưu.
  annual_leave_at_least_12_days:
    ask: ''
    kind: derived
    template_neg: Chưa xác lập quyền nghỉ ít nhất 12 ngày theo điều kiện đang xét.
    template_pos: Người lao động có ít nhất 12 ngày nghỉ hằng năm hưởng nguyên lương.
  awaiting_investigation_art125:
    ask: Có đang chờ cơ quan có thẩm quyền điều tra, kết luận về hành vi vi phạm (trộm
      cắp, tham ô, đánh bạc, ma túy, tiết lộ bí mật...) không?
    kind: input
    template_neg: Không đang chờ kết luận điều tra về hành vi tại khoản 1, 2 Điều
      125.
    template_pos: Đang chờ kết luận của cơ quan có thẩm quyền về hành vi vi phạm tại
      khoản 1, 2 Điều 125.
  break_at_least_30_min:
    ask: ''
    kind: derived
    template_neg: Không xác lập quyền nghỉ giữa giờ 30 phút theo điều kiện đang xét.
    template_pos: Người lao động được nghỉ giữa giờ ít nhất 30 phút liên tục.
  break_at_shift_start_or_end:
    ask: Giờ nghỉ giữa ca có bị xếp vào lúc bắt đầu hoặc kết thúc ca không?
    kind: input
    template_neg: Giờ nghỉ không bố trí vào đầu hoặc cuối ca.
    template_pos: Giờ nghỉ được bố trí vào lúc bắt đầu hoặc kết thúc ca.
  break_scheduling_compliant:
    ask: ''
    kind: derived
    template_neg: Việc bố trí thời điểm nghỉ trong giờ làm việc không đúng quy định.
    template_pos: Việc bố trí thời điểm nghỉ trong giờ làm việc đúng quy định.
  cancel_probation_without_notice_allowed:
    ask: ''
    kind: derived
    template_neg: Người lao động không được hủy thử việc không báo trước theo căn
      cứ đang xét.
    template_pos: Người lao động được hủy bỏ thử việc mà không phải báo trước.
  classified_overtime_holiday:
    ask: ''
    kind: derived
    template_neg: Hoạt động làm thêm không phải ngày lễ.
    template_pos: Hoạt động làm thêm được phân loại vào ngày lễ.
  classified_overtime_weekly_rest:
    ask: ''
    kind: derived
    template_neg: Hoạt động làm thêm không phải ngày nghỉ hằng tuần.
    template_pos: Hoạt động làm thêm được phân loại vào ngày nghỉ hằng tuần.
  college_level_position:
    ask: 'Xin cho biết: Công việc đòi hỏi trình độ chuyên môn từ cao đẳng trở lên.'
    kind: input
    template_neg: Công việc không thuộc nhóm đòi hỏi trình độ từ cao đẳng trở lên.
    template_pos: Công việc đòi hỏi trình độ chuyên môn từ cao đẳng trở lên.
  consented_to_night_work:
    ask: 'Xin cho biết: Lao động nữ nuôi con nhỏ đã đồng ý làm việc ban đêm.'
    kind: input
    template_neg: Lao động nữ nuôi con nhỏ không đồng ý làm việc ban đêm.
    template_pos: Lao động nữ nuôi con nhỏ đã đồng ý làm việc ban đêm.
  continuous_shift_work:
    ask: Người lao động có làm việc theo ca liên tục không?
    kind: input
    template_neg: Người lao động không làm theo ca liên tục.
    template_pos: Người lao động làm việc theo ca liên tục.
  contract_expired_over_30_days:
    ask: 'Xin cho biết: Hợp đồng đã hết hạn quá 30 ngày.'
    kind: input
    template_neg: Hợp đồng mới hết hạn chưa quá 30 ngày.
    template_pos: Hợp đồng đã hết hạn quá 30 ngày.
  contract_under_one_month:
    ask: 'Xin cho biết: Thời hạn hợp đồng lao động dưới một tháng.'
    kind: input
    template_neg: Thời hạn hợp đồng từ một tháng trở lên.
    template_pos: Thời hạn hợp đồng lao động dưới một tháng.
  converted_to_indefinite_contract:
    ask: ''
    kind: derived
    template_neg: Hợp đồng cũ chưa chuyển thành hợp đồng không xác định thời hạn theo
      Điều 20.
    template_pos: Hợp đồng cũ chuyển thành hợp đồng không xác định thời hạn theo Điều
      20.
  discipline_during_pregnancy_allowed:
    ask: ''
    kind: derived
    template_neg: Không được xử lý kỷ luật lao động đối với lao động nữ đang mang
      thai lúc này.
    template_pos: Được xử lý kỷ luật lao động đối với lao động nữ đang mang thai ngay
      lúc này.
  discipline_prohibited_now:
    ask: ''
    kind: derived
    template_neg: Không thuộc thời gian/trường hợp cấm xử lý kỷ luật đang xét.
    template_pos: Không được xử lý kỷ luật lao động đối với người lao động trong thời
      gian/trường hợp này.
  domestic_worker:
    ask: Người lao động có phải lao động giúp việc gia đình không?
    kind: input
    template_neg: Người lao động không phải lao động giúp việc gia đình.
    template_pos: Người lao động là lao động giúp việc gia đình.
  elderly_worker:
    ask: Người lao động có phải người cao tuổi (đã quá tuổi nghỉ hưu) không?
    kind: input
    template_neg: Người lao động không phải người cao tuổi.
    template_pos: Người lao động là người cao tuổi.
  employee_protected_from_discipline:
    ask: ''
    kind: derived
    template_neg: Lao động nữ không đang trong thời kỳ được tạm hoãn xử lý kỷ luật.
    template_pos: Lao động nữ đang trong thời kỳ được tạm hoãn xử lý kỷ luật.
  employer_at_least_10_workers:
    ask: 'Xin cho biết: Người sử dụng lao động có từ 10 nhân viên trở lên.'
    kind: input
    template_neg: Người sử dụng lao động có dưới 10 nhân viên.
    template_pos: Người sử dụng lao động có từ 10 nhân viên trở lên.
  employer_tried_all_remedies:
    ask: Người sử dụng lao động đã tìm mọi biện pháp khắc phục chưa?
    kind: input
    template_neg: Người sử dụng lao động chưa tìm mọi biện pháp khắc phục.
    template_pos: Người sử dụng lao động đã tìm mọi biện pháp khắc phục.
  employer_untruthful_info_affecting_contract:
    ask: Người sử dụng lao động có cung cấp thông tin không trung thực khi giao kết,
      làm ảnh hưởng đến việc thực hiện hợp đồng không?
    kind: input
    template_neg: Người sử dụng lao động không cung cấp thông tin sai lệch ảnh hưởng
      tới hợp đồng.
    template_pos: Người sử dụng lao động cung cấp thông tin không trung thực (khoản
      1 Điều 16) làm ảnh hưởng đến việc thực hiện hợp đồng.
  enterprise_manager_position:
    ask: Công việc thử việc có phải vị trí người quản lý doanh nghiệp không?
    kind: input
    template_neg: Công việc không phải của người quản lý doanh nghiệp.
    template_pos: Công việc là của người quản lý doanh nghiệp.
  especially_heavy_hazardous_work:
    ask: Người lao động có làm nghề, công việc đặc biệt nặng nhọc, độc hại, nguy hiểm
      không?
    kind: input
    template_neg: Người lao động không làm nghề, công việc đặc biệt nặng nhọc, độc
      hại, nguy hiểm.
    template_pos: Người lao động làm nghề, công việc đặc biệt nặng nhọc, độc hại,
      nguy hiểm.
  fixed_term_contract:
    ask: 'Xin cho biết: Đây là hợp đồng lao động xác định thời hạn.'
    kind: input
    template_neg: Đây không phải hợp đồng lao động xác định thời hạn.
    template_pos: Đây là hợp đồng lao động xác định thời hạn.
  fixed_term_from_12_to_36_months:
    ask: 'Xin cho biết: Hợp đồng xác định thời hạn từ 12 đến 36 tháng.'
    kind: input
    template_neg: Hợp đồng không thuộc nhóm từ 12 đến 36 tháng.
    template_pos: Hợp đồng xác định thời hạn từ 12 đến 36 tháng.
  fixed_term_length_compliant:
    ask: ''
    kind: derived
    template_neg: Thời hạn ghi trong hợp đồng xác định thời hạn vượt giới hạn luật
      định.
    template_pos: Thời hạn ghi trong hợp đồng xác định thời hạn đáp ứng giới hạn luật
      định.
  fixed_term_months_le_36:
    ask: 'Xin cho biết: Hợp đồng có thời hạn không quá 36 tháng.'
    kind: input
    template_neg: Hợp đồng có thời hạn trên 36 tháng.
    template_pos: Hợp đồng có thời hạn không quá 36 tháng.
  fixed_term_under_12_months:
    ask: Hợp đồng có phải loại xác định thời hạn dưới 12 tháng không?
    kind: input
    template_neg: Hợp đồng không phải loại xác định thời hạn dưới 12 tháng.
    template_pos: Hợp đồng xác định thời hạn dưới 12 tháng.
  full_year_normal_leave_class:
    ask: ''
    kind: derived
    template_neg: Người lao động không thuộc nhóm đủ năm trong điều kiện bình thường.
    template_pos: Người lao động thuộc nhóm đủ năm trong điều kiện bình thường.
  group_authorized_seasonal_contract:
    ask: Hợp đồng có được giao kết thông qua một người được nhóm người lao động ủy
      quyền (công việc mùa vụ dưới 12 tháng) không?
    kind: input
    template_neg: Hợp đồng không giao kết theo ủy quyền nhóm tại khoản 2 Điều 18.
    template_pos: Hợp đồng do một người được nhóm lao động ủy quyền giao kết cho công
      việc mùa vụ, công việc nhất định dưới 12 tháng (khoản 2 Điều 18).
  has_grassroots_worker_representative:
    ask: Nơi làm việc có tổ chức đại diện người lao động tại cơ sở (công đoàn cơ sở...)
      không?
    kind: input
    template_neg: Nơi làm việc không có tổ chức đại diện người lao động tại cơ sở.
    template_pos: Nơi làm việc có tổ chức đại diện người lao động tại cơ sở.
  in_custody_or_detention:
    ask: Người lao động có đang bị tạm giữ, tạm giam không?
    kind: input
    template_neg: Người lao động không bị tạm giữ, tạm giam.
    template_pos: Người lao động đang bị tạm giữ, tạm giam.
  indefinite_term_contract:
    ask: Hợp đồng lao động có phải loại không xác định thời hạn không?
    kind: input
    template_neg: Đây không phải hợp đồng lao động không xác định thời hạn.
    template_pos: Đây là hợp đồng lao động không xác định thời hạn.
  intermediate_level_position:
    ask: Công việc có đòi hỏi trình độ trung cấp, công nhân kỹ thuật hoặc là nhân
      viên nghiệp vụ không?
    kind: input
    template_neg: Công việc không thuộc nhóm trung cấp, công nhân kỹ thuật, nhân viên
      nghiệp vụ.
    template_pos: Công việc cần trình độ trung cấp, công nhân kỹ thuật hoặc nhân viên
      nghiệp vụ.
  labor_relation:
    ask: ''
    kind: derived
    template_neg: Giữa hai bên không tồn tại quan hệ lao động.
    template_pos: Giữa hai bên tồn tại quan hệ lao động.
  late_wage_payment_permitted:
    ask: ''
    kind: derived
    template_neg: Không được trả lương chậm.
    template_pos: Việc trả lương chậm được pháp luật cho phép.
  lawful_temporary_transfer_art29:
    ask: Việc bố trí công việc khác có phải là tạm chuyển công việc hợp lệ theo Điều
      29 không?
    kind: input
    template_neg: Việc bố trí khác thỏa thuận không phải tạm chuyển hợp lệ theo Điều
      29.
    template_pos: Việc bố trí khác thỏa thuận là tạm chuyển công việc hợp lệ theo
      Điều 29.
  medical_confirmation_harm_to_fetus:
    ask: Có giấy xác nhận của cơ sở khám chữa bệnh rằng tiếp tục làm việc sẽ ảnh hưởng
      xấu đến thai nhi không?
    kind: input
    template_neg: Không có xác nhận y tế về ảnh hưởng xấu tới thai nhi.
    template_pos: Có xác nhận của cơ sở khám bệnh, chữa bệnh rằng tiếp tục làm việc
      sẽ ảnh hưởng xấu tới thai nhi.
  minor_disabled_or_heavy_work:
    ask: Người lao động có phải người chưa thành niên, người khuyết tật hoặc làm nghề,
      công việc nặng nhọc, độc hại, nguy hiểm không?
    kind: input
    template_neg: Người lao động không thuộc nhóm chưa thành niên, khuyết tật hoặc
      làm công việc nặng nhọc, độc hại, nguy hiểm.
    template_pos: Người lao động chưa thành niên, là người khuyết tật hoặc làm nghề,
      công việc nặng nhọc, độc hại, nguy hiểm.
  mistreated_or_forced_labor:
    ask: Người lao động có bị người sử dụng lao động ngược đãi, đánh đập, nhục mạ
      hoặc cưỡng bức lao động không?
    kind: input
    template_neg: Người lao động không bị ngược đãi, nhục mạ hay cưỡng bức lao động.
    template_pos: Người lao động bị ngược đãi, đánh đập, nhục mạ, xúc phạm sức khỏe,
      nhân phẩm, danh dự hoặc bị cưỡng bức lao động.
  must_agree_discipline_in_contract:
    ask: ''
    kind: derived
    template_neg: Không bắt buộc thỏa thuận kỷ luật, trách nhiệm vật chất trong hợp
      đồng.
    template_pos: Phải thỏa thuận nội dung kỷ luật lao động, trách nhiệm vật chất
      trong hợp đồng lao động.
  must_compensate_late_wage_interest:
    ask: ''
    kind: derived
    template_neg: Không phát sinh nghĩa vụ đền bù tiền lãi trả lương chậm.
    template_pos: Người sử dụng lao động phải đền bù ít nhất bằng tiền lãi của số
      tiền trả chậm.
  must_consult_representative_on_internal_rules:
    ask: ''
    kind: derived
    template_neg: Không có nghĩa vụ tham khảo ý kiến tổ chức đại diện về nội quy.
    template_pos: Phải tham khảo ý kiến tổ chức đại diện người lao động trước khi
      ban hành, sửa đổi nội quy.
  must_issue_internal_rules:
    ask: ''
    kind: derived
    template_neg: Người sử dụng lao động không phải ban hành nội quy lao động.
    template_pos: Người sử dụng lao động phải ban hành nội quy lao động.
  must_register_internal_rules:
    ask: ''
    kind: derived
    template_neg: Người sử dụng lao động không phải đăng ký nội quy theo ngưỡng nhân
      sự đang xét.
    template_pos: Người sử dụng lao động phải đăng ký nội quy lao động.
  must_sign_indefinite_contract:
    ask: ''
    kind: derived
    template_neg: Không bắt buộc ký hợp đồng không xác định thời hạn.
    template_pos: Hai bên phải ký hợp đồng lao động không xác định thời hạn.
  night_overtime_extra_20_percent:
    ask: ''
    kind: derived
    template_neg: Không phát sinh khoản trả thêm 20% làm thêm ban đêm.
    template_pos: Được trả thêm 20% tiền lương ban ngày cho giờ làm thêm ban đêm.
  night_shift_break_at_least_45_min:
    ask: ''
    kind: derived
    template_neg: Không thể áp dụng mức nghỉ giữa ca 45 phút theo điều kiện đang xét.
    template_pos: Người lao động có quyền nghỉ giữa ca ít nhất 45 phút liên tục.
  night_shift_break_threshold_met:
    ask: ''
    kind: derived
    template_neg: Chưa đủ điều kiện nghỉ ca đêm 45 phút.
    template_pos: Đã đủ điều kiện nhận nghỉ ca đêm 45 phút.
  night_work_permitted_for_nursing:
    ask: ''
    kind: derived
    template_neg: Không thể bố trí lao động nữ nuôi con dưới 12 tháng làm ban đêm
      nếu không có sự đồng ý.
    template_pos: Có thể bố trí lao động nữ nuôi con dưới 12 tháng làm ban đêm nếu
      được đồng ý.
  night_work_permitted_for_pregnant:
    ask: ''
    kind: derived
    template_neg: Không được sử dụng lao động nữ mang thai từ tháng thứ bảy làm việc
      ban đêm.
    template_pos: Được sử dụng lao động nữ mang thai từ tháng thứ bảy làm việc ban
      đêm.
  night_work_premium_at_least_30_percent:
    ask: ''
    kind: derived
    template_neg: Không phát sinh khoản trả thêm 30% làm ban đêm.
    template_pos: Được trả thêm ít nhất 30% tiền lương cho giờ làm ban đêm.
  nightwork_at_least_three_hours:
    ask: 'Xin cho biết: Trong ca có ít nhất ba giờ làm việc ban đêm.'
    kind: input
    template_neg: Trong ca có dưới ba giờ làm việc ban đêm.
    template_pos: Trong ca có ít nhất ba giờ làm việc ban đêm.
  no_new_contract:
    ask: 'Xin cho biết: Hai bên chưa ký hợp đồng lao động mới sau khi hợp đồng cũ
      hết hạn.'
    kind: input
    template_neg: Hai bên đã ký hợp đồng mới.
    template_pos: Hai bên chưa ký hợp đồng lao động mới sau khi hợp đồng cũ hết hạn.
  no_notice_wage_exception:
    ask: ''
    kind: derived
