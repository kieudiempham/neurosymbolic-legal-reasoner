predicates:
  cash_deposited_into_seller_account:
    ask: Bên mua có thanh toán bằng cách nộp tiền mặt vào tài khoản của bên bán không?
    kind: input
    template_neg: Bên mua không thanh toán bằng cách nộp tiền mặt vào tài khoản bên
      bán.
    template_pos: Bên mua nộp tiền mặt vào tài khoản của bên bán.
  cit_30pct_special_workers:
    ask: 'Xin cho biết: Ít nhất 30% lao động bình quân thuộc các nhóm nêu ở điều luật.'
    kind: input
    template_neg: Tỷ lệ các nhóm lao động nêu ở điều luật dưới 30%.
    template_pos: Ít nhất 30% lao động bình quân thuộc các nhóm nêu ở điều luật.
  cit_accrual_improper:
    ask: Khoản trích trước vào chi phí có sai quy định không?
    kind: input
    template_neg: Khoản trích trước đúng quy định.
    template_pos: Khoản trích trước vào chi phí không đúng quy định.
  cit_administrative_fine:
    ask: 'Xin cho biết: Khoản chi là tiền phạt vi phạm hành chính.'
    kind: input
    template_neg: Khoản chi không phải tiền phạt vi phạm hành chính.
    template_pos: Khoản chi là tiền phạt vi phạm hành chính.
  cit_agri_cooperative:
    ask: 'Xin cho biết: Chủ thể là hợp tác xã sản xuất nông sản.'
    kind: input
    template_neg: Chủ thể không phải hợp tác xã sản xuất nông sản.
    template_pos: Chủ thể là hợp tác xã sản xuất nông sản.
  cit_agri_production_or_processing_income:
    ask: Thu nhập có từ trồng trọt, rừng trồng, chăn nuôi, nuôi trồng thủy sản hoặc
      chế biến nông/thủy sản không?
    kind: input
    template_neg: Thu nhập không từ trồng trọt, chăn nuôi, thủy sản nuôi trồng hay
      chế biến nông/thủy sản.
    template_pos: Thu nhập từ trồng trọt, rừng trồng, chăn nuôi, thủy sản nuôi trồng
      hoặc chế biến nông sản, thủy sản.
  cit_agricultural_technical_service:
    ask: 'Xin cho biết: Thu nhập từ dịch vụ kỹ thuật trực tiếp phục vụ nông nghiệp.'
    kind: input
    template_neg: Thu nhập không từ dịch vụ kỹ thuật trực tiếp phục vụ nông nghiệp.
    template_pos: Thu nhập từ dịch vụ kỹ thuật trực tiếp phục vụ nông nghiệp.
  cit_asset_revaluation_soe_restructuring:
    ask: Khoản thu có phải chênh lệch đánh giá lại tài sản để cổ phần hóa hoặc sắp
      xếp DN 100% vốn Nhà nước không?
    kind: input
    template_neg: Không phải chênh lệch đánh giá lại tài sản khi cổ phần hóa/sắp xếp
      DN 100% vốn Nhà nước.
    template_pos: Chênh lệch đánh giá lại tài sản để cổ phần hóa, sắp xếp DN 100%
      vốn Nhà nước.
  cit_average_workers_at_least_20:
    ask: 'Xin cho biết: Doanh nghiệp có từ 20 lao động bình quân trong năm.'
    kind: input
    template_neg: Doanh nghiệp có dưới 20 lao động bình quân trong năm.
    template_pos: Doanh nghiệp có từ 20 lao động bình quân trong năm.
  cit_business_expense_qualified:
    ask: ''
    kind: derived
    template_neg: cit business expense qualified không được xác lập.
    template_pos: cit business expense qualified được xác lập.
  cit_business_related_expense:
    ask: 'Xin cho biết: Khoản chi thực tế liên quan hoạt động kinh doanh.'
    kind: input
    template_neg: Khoản chi không liên quan hoạt động kinh doanh.
    template_pos: Khoản chi thực tế liên quan hoạt động kinh doanh.
  cit_capex_investment_phase:
    ask: Khoản chi có phải đầu tư xây dựng cơ bản để hình thành TSCĐ không?
    kind: input
    template_neg: Không phải chi XDCB giai đoạn đầu tư.
    template_pos: Chi đầu tư XDCB trong giai đoạn đầu tư hình thành TSCĐ.
  cit_carbon_credit_first_transfer_income:
    ask: Có phải DN được cấp chuyển nhượng lần đầu chứng chỉ giảm phát thải hoặc tín
      chỉ các-bon không?
    kind: input
    template_neg: Không phải chuyển nhượng lần đầu chứng chỉ giảm phát thải/tín chỉ
      các-bon.
    template_pos: Thu nhập từ chuyển nhượng lần đầu chứng chỉ giảm phát thải/tín chỉ
      các-bon của DN được cấp.
  cit_cooperative_in_agri_forestry_fishery_salt_sector:
    ask: Đây có phải HTX hoạt động trong lĩnh vực nông, lâm, ngư hoặc diêm nghiệp
      không?
    kind: input
    template_neg: HTX không hoạt động trong lĩnh vực nông, lâm, ngư, diêm nghiệp.
    template_pos: HTX/liên hiệp HTX hoạt động trong lĩnh vực nông, lâm, ngư, diêm
      nghiệp.
  cit_cooperative_indivisible_fund_income:
    ask: Có phải phần thu nhập hình thành quỹ chung, tài sản chung không chia của
      HTX không?
    kind: input
    template_neg: Không phải thu nhập hình thành quỹ/tài sản chung không chia của
      HTX.
    template_pos: Phần thu nhập hình thành quỹ chung, tài sản chung không chia của
      HTX.
  cit_defense_security_expense:
    ask: Khoản chi có phục vụ giáo dục quốc phòng an ninh, dân quân tự vệ hoặc nhiệm
      vụ QP-AN không?
    kind: input
    template_neg: Khoản chi không thuộc nhiệm vụ quốc phòng, an ninh.
    template_pos: Khoản chi cho giáo dục quốc phòng an ninh, dân quân tự vệ, nhiệm
      vụ QP-AN.
  cit_depreciation_improper:
    ask: Khấu hao tài sản cố định có sai hoặc vượt mức không?
    kind: input
    template_neg: Khấu hao TSCĐ đúng quy định.
    template_pos: Khấu hao TSCĐ không đúng hoặc vượt mức.
  cit_designated_fund_contribution:
    ask: Có phải đóng góp vào quỹ được thành lập theo quyết định của Thủ tướng hoặc
      quy định Chính phủ không?
    kind: input
    template_neg: Không phải đóng góp vào quỹ do Thủ tướng/Chính phủ quy định.
    template_pos: Khoản đóng góp vào quỹ thành lập theo quyết định Thủ tướng/quy định
      Chính phủ.
  cit_direct_state_support:
    ask: Khoản thu có phải hỗ trợ trực tiếp từ ngân sách nhà nước hoặc Quỹ hỗ trợ
      đầu tư của Chính phủ không?
    kind: input
    template_neg: Không phải hỗ trợ trực tiếp từ NSNN hay Quỹ hỗ trợ đầu tư.
    template_pos: Khoản hỗ trợ trực tiếp từ ngân sách nhà nước hoặc Quỹ hỗ trợ đầu
      tư do Chính phủ thành lập.
  cit_distributed_domestic_income:
    ask: 'Xin cho biết: Có khoản thu được chia từ vốn góp vào doanh nghiệp trong nước.'
    kind: input
    template_neg: Không có khoản thu chia từ vốn góp doanh nghiệp trong nước.
    template_pos: Có khoản thu được chia từ vốn góp vào doanh nghiệp trong nước.
  cit_donation_received_charity:
    ask: 'Xin cho biết: Có khoản tài trợ nhận về dành cho hoạt động từ thiện.'
    kind: input
    template_neg: Khoản nhận không phải tài trợ dành cho hoạt động từ thiện.
    template_pos: Có khoản tài trợ nhận về dành cho hoạt động từ thiện.
  cit_donation_received_rnd_from_unrelated:
    ask: Có nhận tài trợ từ bên không liên kết để dùng cho nghiên cứu khoa học, công
      nghệ, đổi mới sáng tạo không?
    kind: input
    template_neg: Khoản nhận không phải tài trợ NCKH/ĐMST từ bên không liên kết.
    template_pos: Khoản tài trợ nhận từ bên không có quan hệ liên kết để dùng cho
      NCKH, phát triển công nghệ, ĐMST, chuyển đổi số.
  cit_donation_used_correctly:
    ask: 'Xin cho biết: Khoản tài trợ được sử dụng đúng mục đích từ thiện.'
    kind: input
    template_neg: Khoản tài trợ bị sử dụng sai mục đích từ thiện.
    template_pos: Khoản tài trợ được sử dụng đúng mục đích từ thiện.
  cit_emission_reduction_expense:
    ask: Khoản chi có nhằm giảm phát thải, giảm ô nhiễm và gắn với SXKD không?
    kind: input
    template_neg: Không phải chi giảm phát thải gắn với SXKD.
    template_pos: Chi phí giảm phát thải, trung hòa các-bon, giảm ô nhiễm gắn với
      SXKD.
  cit_employee_paid_noncash_authorized:
    ask: Người lao động có được ủy quyền mua hộ, trả không tiền mặt và DN hoàn lại
      theo quy chế không?
    kind: input
    template_neg: Không phải trường hợp người lao động được ủy quyền thanh toán không
      tiền mặt.
    template_pos: Người lao động được ủy quyền mua hộ, thanh toán không dùng tiền
      mặt và được DN hoàn lại theo quy chế.
  cit_employee_vocational_training_expense:
    ask: Khoản chi có phải chi đào tạo nghề cho người lao động không?
    kind: input
    template_neg: Khoản chi không phải đào tạo nghề cho người lao động.
    template_pos: Khoản chi giáo dục, đào tạo nghề cho người lao động.
  cit_equity_change_expense:
    ask: Khoản chi có liên quan trực tiếp tăng, giảm vốn chủ sở hữu không?
    kind: input
    template_neg: Không phải chi liên quan tăng, giảm vốn chủ sở hữu.
    template_pos: Chi liên quan trực tiếp đến tăng, giảm vốn chủ sở hữu.
  cit_expected_revenue_above_3_up_to_50bn:
    ask: Doanh thu dự kiến trong kỳ có trên 3 tỷ và không quá 50 tỷ đồng không?
    kind: input
    template_neg: Tổng doanh thu dự kiến nằm ngoài khoảng trên 3 đến 50 tỷ đồng.
    template_pos: Tổng doanh thu dự kiến trong kỳ trên 3 tỷ đến không quá 50 tỷ đồng.
  cit_expected_revenue_le_3bn:
    ask: Doanh thu dự kiến trong kỳ có không quá 3 tỷ đồng không?
    kind: input
    template_neg: Tổng doanh thu dự kiến trong kỳ trên 3 tỷ đồng.
    template_pos: Tổng doanh thu dự kiến trong kỳ không quá 3 tỷ đồng.
  cit_expense_at_least_5m:
    ask: 'Xin cho biết: Khoản chi mua sắm mỗi lần từ 5 triệu đồng.'
    kind: input
    template_neg: Khoản chi mua sắm mỗi lần dưới 5 triệu đồng.
    template_pos: Khoản chi mua sắm mỗi lần từ 5 triệu đồng.
  cit_expense_deductible:
    ask: ''
    kind: derived
    template_neg: Khoản chi không được trừ khi tính thu nhập chịu thuế TNDN.
    template_pos: Khoản chi được trừ khi tính thu nhập chịu thuế TNDN.
  cit_expense_documentation_ok:
    ask: ''
    kind: derived
    template_neg: Khoản chi không đáp ứng điều kiện hóa đơn, chứng từ thanh toán.
    template_pos: Khoản chi đáp ứng điều kiện hóa đơn, chứng từ và thanh toán không
      dùng tiền mặt.
  cit_expense_exceeds_government_cap:
    ask: Khoản chi có vượt mức Chính phủ quy định không?
    kind: input
    template_neg: Khoản chi không vượt mức Chính phủ quy định.
    template_pos: Phần chi vượt mức Chính phủ quy định.
  cit_expense_invoice:
    ask: 'Xin cho biết: Khoản chi có hóa đơn chứng từ theo quy định.'
    kind: input
    template_neg: Khoản chi không có hóa đơn chứng từ theo quy định.
    template_pos: Khoản chi có hóa đơn chứng từ theo quy định.
  cit_expense_is_donation:
    ask: Khoản chi có phải là khoản tài trợ không?
    kind: input
    template_neg: Khoản chi không phải khoản tài trợ.
    template_pos: Khoản chi là khoản tài trợ.
  cit_expense_not_matching_taxable_revenue:
    ask: Khoản chi có tương ứng với doanh thu tính thuế không?
    kind: input
    template_neg: Khoản chi tương ứng với doanh thu tính thuế.
    template_pos: Khoản chi không tương ứng với doanh thu tính thuế.
  cit_expense_payment_proof:
    ask: 'Xin cho biết: Có chứng từ thanh toán không dùng tiền mặt theo quy định đối
      với khoản chi.'
    kind: input
    template_neg: Không có chứng từ thanh toán không dùng tiền mặt theo quy định.
    template_pos: Có chứng từ thanh toán không dùng tiền mặt theo quy định đối với
      khoản chi.
  cit_expense_reimbursed:
    ask: 'Xin cho biết: Khoản chi đã được bù đắp bằng nguồn kinh phí khác.'
    kind: input
    template_neg: Khoản chi không được bù đắp bằng nguồn kinh phí khác.
    template_pos: Khoản chi đã được bù đắp bằng nguồn kinh phí khác.
  cit_expense_unpaid_at_recognition:
    ask: Khi ghi nhận chi phí, DN đã thanh toán khoản chi chưa?
    kind: input
    template_neg: DN đã thanh toán khoản chi khi ghi nhận chi phí.
    template_pos: Đến thời điểm ghi nhận chi phí, DN chưa thanh toán khoản chi.
  cit_expense_violates_sector_conditions:
    ask: Khoản chi có trái điều kiện chi của pháp luật chuyên ngành không?
    kind: input
    template_neg: Khoản chi đáp ứng pháp luật chuyên ngành.
    template_pos: Khoản chi không đáp ứng điều kiện, nội dung chi theo pháp luật chuyên
      ngành.
  cit_fishing_income:
    ask: 'Xin cho biết: Thu nhập đến từ hoạt động đánh bắt hải sản.'
    kind: input
    template_neg: Thu nhập không từ đánh bắt hải sản.
    template_pos: Thu nhập đến từ hoạt động đánh bắt hải sản.
  cit_founder_remuneration_non_executive:
    ask: Có phải thù lao cho sáng lập viên không trực tiếp điều hành không?
    kind: input
    template_neg: Không phải thù lao sáng lập viên không điều hành.
    template_pos: Thù lao trả cho sáng lập viên không trực tiếp điều hành.
  cit_green_bond_first_transfer_income:
    ask: Có phải chuyển nhượng trái phiếu xanh lần đầu sau phát hành không?
    kind: input
    template_neg: Không phải chuyển nhượng trái phiếu xanh lần đầu.
    template_pos: Thu nhập từ chuyển nhượng trái phiếu xanh lần đầu sau phát hành.
  cit_green_bond_interest_income:
    ask: Thu nhập có phải lãi trái phiếu xanh không?
    kind: input
    template_neg: Không phải lãi trái phiếu xanh.
    template_pos: Thu nhập từ tiền lãi trái phiếu xanh.
  cit_in_art12_3_incentive_area:
    ask: Hoạt động có nằm tại địa bàn ưu đãi thuế (khoản 3 Điều 12 Luật TNDN) không?
    kind: input
    template_neg: Hoạt động/dự án không nằm tại địa bàn ưu đãi theo khoản 3 Điều 12.
    template_pos: Hoạt động/dự án nằm tại địa bàn ưu đãi thuế quy định tại khoản 3
      Điều 12 Luật TNDN.
  cit_in_difficult_area:
    ask: Hoạt động có ở địa bàn kinh tế - xã hội khó khăn không?
    kind: input
    template_neg: Không ở địa bàn có điều kiện kinh tế - xã hội khó khăn.
    template_pos: Hoạt động ở địa bàn có điều kiện kinh tế - xã hội khó khăn.
  cit_in_especially_difficult_area:
    ask: Hoạt động có ở địa bàn kinh tế - xã hội đặc biệt khó khăn không?
    kind: input
    template_neg: Không ở địa bàn có điều kiện kinh tế - xã hội đặc biệt khó khăn.
    template_pos: Hoạt động ở địa bàn có điều kiện kinh tế - xã hội đặc biệt khó khăn.
  cit_income_art12_2_l_activity:
    ask: Thu nhập có từ ngành, nghề ưu đãi tại điểm l khoản 2 Điều 12 Luật Thuế TNDN
      không?
    kind: input
    template_neg: Thu nhập không thuộc ngành, nghề điểm l khoản 2 Điều 12.
    template_pos: Thu nhập từ hoạt động thuộc ngành, nghề điểm l khoản 2 Điều 12 Luật
      TNDN.
  cit_income_art12_2_p:
    ask: Thu nhập có thuộc trường hợp tại điểm p khoản 2 Điều 12 Luật Thuế TNDN không?
    kind: input
    template_neg: Thu nhập không thuộc điểm p khoản 2 Điều 12.
    template_pos: Thu nhập của doanh nghiệp thuộc điểm p khoản 2 Điều 12 Luật TNDN.
  cit_income_exempt:
    ask: ''
    kind: derived
    template_neg: Khoản thu nhập không thuộc diện miễn thuế TNDN.
    template_pos: Khoản thu nhập thuộc diện miễn thuế TNDN.
  cit_input_vat_already_deducted:
    ask: Khoản chi có phải thuế GTGT đầu vào đã được khấu trừ không?
    kind: input
    template_neg: Khoản chi không phải thuế GTGT đã khấu trừ.
    template_pos: Khoản chi là thuế GTGT đầu vào đã khấu trừ hoặc thuế GTGT nộp theo
      phương pháp khấu trừ.
  cit_interest_nondeductible_portion:
    ask: Lãi vay có ứng với vốn điều lệ còn thiếu, đã vốn hóa, cho hợp đồng dầu khí
      hoặc vượt mức Bộ luật Dân sự không?
    kind: input
    template_neg: Lãi vay không thuộc phần bị loại trừ.
    template_pos: Khoản lãi vay thuộc phần không được trừ (vốn điều lệ còn thiếu,
      đã vốn hóa, dầu khí, vượt mức BLDS).
  cit_is_cooperative:
    ask: Chủ thể có phải hợp tác xã hoặc liên hiệp hợp tác xã không?
    kind: input
