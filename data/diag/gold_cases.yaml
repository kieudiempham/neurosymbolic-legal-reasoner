  # ---------------- Câu thật, thiếu dữ kiện (Missing Case Information tự nhiên) ----------------
  - id: BHXH-078
    source: BHXH-078
    question: "Tôi làm việc 6 tháng, nhận lương đều nhưng công ty không ký hợp đồng bằng văn bản. Tôi có thể yêu cầu đóng BHXH được không?"
    goal: compulsory_si
    facts:
      - {pred: term_at_least_1_month, value: true, span: "làm việc 6 tháng"}
      - {pred: paid_wage, value: true, span: "nhận lương đều"}
      - {pred: signed_labor_contract, value: false, span: "không ký hợp đồng bằng văn bản"}
    expected: unknown
    natural_missing: [under_management]
  - id: BHXH-063
    source: BHXH-063
    question: "Tôi không được ký hợp đồng bằng văn bản nhưng làm việc ổn định đã hơn 6 tháng và nhận lương đều hằng tháng. Trường hợp này có thể yêu cầu đóng BHXH không?"
    goal: compulsory_si
    facts:
      - {pred: signed_labor_contract, value: false, span: "không được ký hợp đồng bằng văn bản"}
      - {pred: term_at_least_1_month, value: true, span: "hơn 6 tháng"}
      - {pred: paid_wage, value: true, span: "nhận lương đều hằng tháng"}
    expected: unknown
    natural_missing: [under_management]
  - id: BHXH-044
    source: BHXH-044
    question: "Tôi ký giấy tờ ghi là hợp đồng khoán việc 2 tháng, nhưng thực tế vẫn đi làm giờ hành chính và chịu sự quản lý của công ty. Trong trường hợp này có phải đóng BHXH bắt buộc không?"
    goal: compulsory_si
