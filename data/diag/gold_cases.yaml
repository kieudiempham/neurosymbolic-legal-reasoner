      - {pred: under_management, value: true, span: "chịu sự quản lý của công ty"}
    expected: unknown
    natural_missing: [paid_wage]
  - id: BHXH-083
    source: BHXH-083
    question: "Tôi ký hợp đồng cộng tác viên nhưng bị quản lý giờ giấc và KPI như nhân viên chính thức. Vậy tôi có phải đóng BHXH không?"
    goal: compulsory_si
    facts:
      - {pred: under_management, value: true, span: "bị quản lý giờ giấc và KPI"}
    expected: unknown
    natural_missing: [paid_wage, term_at_least_1_month]
  - id: BHXH-081
    source: BHXH-081
    question: "Tôi là người nước ngoài làm việc tại Việt Nam theo hợp đồng lao động. Tôi có phải tham gia BHXH bắt buộc không?"
