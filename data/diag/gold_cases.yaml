# Gold cases cho diagnostic benchmark (BHXH).
# source: id trong evaluation/qa_290_exp_cases_gold_mode.jsonl, hoặc "synthetic" (tự viết, đủ dữ kiện).
# facts: dữ kiện câu hỏi thực sự nêu; value true/false; span = chuỗi con nguyên văn trong câu hỏi.
# expected: kết luận đúng theo KB (true / false / unknown / abstain). Script tự kiểm tra lại bằng reasoner.

cases:
  # ---------------- Câu thật, đủ dữ kiện ----------------
  - id: BHXH-068
    source: BHXH-068
    question: "Tôi ký hợp đồng lao động 12 tháng với công ty tư nhân. Xin hỏi trường hợp này có bắt buộc phải tham gia BHXH không?"
    goal: compulsory_si
    facts:
      - {pred: signed_labor_contract, value: true, span: "ký hợp đồng lao động"}
      - {pred: term_at_least_1_month, value: true, span: "12 tháng"}
    expected: true
  - id: BHXH-069
    source: BHXH-069
    question: "Tôi chỉ ký hợp đồng lao động 20 ngày để làm việc ngắn hạn. Vậy tôi có phải đóng BHXH bắt buộc không?"
    goal: compulsory_si
    facts:
      - {pred: signed_labor_contract, value: true, span: "ký hợp đồng lao động"}
      - {pred: term_at_least_1_month, value: false, span: "20 ngày"}
    expected: false
  - id: BHXH-089
    source: BHXH-089
    question: "Tôi ký hợp đồng lao động 45 ngày. Xin hỏi trường hợp này có phải đóng BHXH bắt buộc không?"
