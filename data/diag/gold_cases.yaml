    expected: true
  - id: BHXH-004
    source: BHXH-004
    question: "Tôi làm việc thời vụ chưa tới 01 tháng, công ty bảo chưa phải đóng BHXH. Như vậy có đúng không?"
    goal: compulsory_si
    facts:
      - {pred: term_at_least_1_month, value: false, span: "chưa tới 01 tháng"}
    expected: false
  - id: BHXH-059
    source: BHXH-059
    question: "Công ty nói phải làm đủ 2 tháng mới được đóng BHXH. Trong khi tôi đã ký hợp đồng lao động 12 tháng từ ngày đầu tiên. Công ty nói vậy có đúng không?"
    goal: compulsory_si
    facts:
      - {pred: signed_labor_contract, value: true, span: "đã ký hợp đồng lao động"}
      - {pred: term_at_least_1_month, value: true, span: "12 tháng"}
    expected: true
  - id: BHXH-084
    source: BHXH-084
    question: "Tôi ký hợp đồng 1 năm nhưng công ty bảo làm qua 2 tháng mới đóng BHXH. Công ty làm vậy có đúng không?"
    goal: compulsory_si
    facts:
      - {pred: signed_labor_contract, value: true, span: "ký hợp đồng"}
      - {pred: term_at_least_1_month, value: true, span: "1 năm"}
    expected: true
  - id: BHXH-073
    source: BHXH-073
    question: "Tôi là giám đốc công ty và có nhận lương hằng tháng. Tôi có phải đóng BHXH bắt buộc không?"
    goal: compulsory_si
    facts:
      - {pred: enterprise_manager, value: true, span: "là giám đốc công ty"}
      - {pred: receives_salary, value: true, span: "có nhận lương hằng tháng"}
    expected: true
  - id: BHXH-074
    source: BHXH-074
    question: "Tôi đứng tên giám đốc nhưng không hưởng lương. Vậy tôi có bắt buộc phải đóng BHXH không?"
