  covered_point_m:
    ask: Bạn có phải chủ hộ kinh doanh đã đăng ký kinh doanh không?
    kind: input
    origin: templates_file
    template_neg: Người này không phải chủ hộ kinh doanh có đăng ký kinh doanh.
    template_pos: Người này là chủ hộ kinh doanh có đăng ký kinh doanh.
  covered_point_n:
    ask: ''
    kind: derived
    origin: templates_file
    template_neg: Người này không phải người quản lý không hưởng tiền lương.
