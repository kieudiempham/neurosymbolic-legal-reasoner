    template_pos: Người lao động thuộc diện quy định tại điểm b khoản 1 Điều 2 Luật
      BHXH.
  covered_point_c:
    ask: Bạn có làm việc trong quốc phòng, công an hoặc cơ yếu không?
    kind: input
    origin: templates_file
    template_neg: Người này không phải công nhân, viên chức quốc phòng, công nhân
      công an hay người làm công tác cơ yếu.
    template_pos: Người này là công nhân, viên chức quốc phòng, công nhân công an
      hoặc người làm công tác khác trong tổ chức cơ yếu.
  covered_point_d:
    ask: Người lao động có thuộc diện quy định tại điểm d khoản 1 Điều 2 Luật BHXH
      không?
    kind: derived
    template_neg: Người lao động không thuộc diện quy định tại điểm d khoản 1 Điều
      2 Luật BHXH.
    template_pos: Người lao động thuộc diện quy định tại điểm d khoản 1 Điều 2 Luật
      BHXH.
  covered_point_dd:
    ask: Bạn có đang thực hiện nghĩa vụ quân sự hoặc nghĩa vụ công an không?
    kind: input
    origin: templates_file
    template_neg: Người này không phải hạ sĩ quan, binh sĩ hay chiến sĩ nghĩa vụ.
