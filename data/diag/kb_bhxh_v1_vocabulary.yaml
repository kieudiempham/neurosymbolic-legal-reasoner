      sĩ nghĩa vụ công an.
  covered_point_e:
    ask: Bạn có phải là dân quân thường trực không?
    kind: input
    origin: templates_file
    template_neg: Người này không phải dân quân thường trực.
    template_pos: Người này là dân quân thường trực.
  covered_point_g:
    ask: Bạn có đi làm việc ở nước ngoài theo hợp đồng không?
