predicates:
  age_at_least_15:
    ask: Người lao động có đủ 15 tuổi không?
    kind: input
    template_neg: Người lao động chưa đủ 15 tuổi.
    template_pos: Người lao động đủ 15 tuổi.
  age_within_10_below_retirement:
    ask: Bạn còn cách tuổi nghỉ hưu bao nhiêu năm?
    kind: input
    origin: templates_file
    template_neg: Người lao động thấp hơn tuổi nghỉ hưu quá 10 tuổi.
    template_pos: Người lao động có tuổi thấp hơn tối đa 10 tuổi so với tuổi nghỉ
      hưu.
  age_within_5_below_retirement:
    ask: Bạn còn cách tuổi nghỉ hưu bao nhiêu năm?
    kind: input
    origin: templates_file
    template_neg: Người lao động thấp hơn tuổi nghỉ hưu quá 5 tuổi.
    template_pos: Người lao động có tuổi thấp hơn tối đa 5 tuổi so với tuổi nghỉ hưu.
  agreed_contribution:
    ask: Bạn và công ty có thỏa thuận vẫn đóng BHXH trong thời gian này không?
    default: false
    kind: input
    template_neg: Người lao động và công ty không có thỏa thuận về việc đóng bảo hiểm
      xã hội trong thời gian này.
    template_pos: Người lao động và công ty thỏa thuận vẫn đóng bảo hiểm xã hội trong
      thời gian này.
  alternative_work_agreement:
    ask: Hai bên có thỏa thuận làm việc dưới tên gọi khác hay không?
    kind: input
    template_neg: Hai bên không có thỏa thuận làm việc dưới tên gọi khác.
    template_pos: Hai bên có thỏa thuận làm việc được đặt tên khác hợp đồng lao động.
  business_registered:
    ask: Hộ kinh doanh của bạn đã đăng ký kinh doanh chưa?
    kind: input
    template_neg: Hộ kinh doanh chưa đăng ký kinh doanh.
    template_pos: Hộ kinh doanh đã đăng ký kinh doanh.
  can_choose_pension_or_lump_sum:
    ask: ''
    kind: derived
    origin: templates_file
    template_neg: Người lao động không được lựa chọn giữa lương hưu và bảo hiểm xã
      hội một lần.
    template_pos: Người lao động được lựa chọn hưởng lương hưu hoặc bảo hiểm xã hội
      một lần.
  can_pay_lump_sum_remaining_months:
    ask: ''
    kind: derived
    origin: templates_file
    template_neg: Người lao động không được đóng tiếp một lần cho số tháng còn thiếu.
    template_pos: Người lao động được đóng tiếp một lần cho số tháng còn thiếu.
  compulsory_si:
    kind: derived
    template_neg: Người lao động không thuộc đối tượng tham gia bảo hiểm xã hội bắt
      buộc.
    template_pos: Người lao động thuộc đối tượng tham gia bảo hiểm xã hội bắt buộc.
  contract_suspended:
    ask: Hợp đồng lao động của bạn có đang tạm hoãn không?
    default: false
    kind: input
    template_neg: Hợp đồng lao động không bị tạm hoãn.
    template_pos: Hợp đồng lao động đang tạm hoãn thực hiện.
  contribute_at_first_contract:
    kind: derived
    template_neg: Người lao động không tham gia theo hợp đồng giao kết đầu tiên.
    template_pos: Người lao động tham gia bảo hiểm xã hội bắt buộc theo hợp đồng lao
      động giao kết đầu tiên.
  contributed_before_law_effective:
    ask: Bạn có thời gian đóng BHXH trước ngày 01/7/2025 không?
    kind: input
    origin: templates_file
    template_neg: Người lao động không có thời gian đóng bảo hiểm xã hội trước ngày
      Luật Bảo hiểm xã hội 2024 có hiệu lực.
    template_pos: Người lao động có thời gian đóng bảo hiểm xã hội trước ngày Luật
      Bảo hiểm xã hội 2024 có hiệu lực.
  contribution_15_years:
    ask: Bạn đã đóng BHXH bắt buộc được bao nhiêu năm?
    kind: input
    template_neg: Người lao động đóng bảo hiểm xã hội chưa đủ 15 năm.
    template_pos: Người lao động đã đóng bảo hiểm xã hội bắt buộc từ đủ 15 năm trở
      lên.
  contribution_20_years:
    ask: Người lao động đã đóng bảo hiểm xã hội bắt buộc từ đủ 20 năm trở lên chưa?
    kind: input
    template_neg: Người lao động chưa đóng bảo hiểm xã hội bắt buộc đủ 20 năm.
    template_pos: Người lao động đã đóng bảo hiểm xã hội bắt buộc từ đủ 20 năm trở
      lên.
  contribution_method_direct_or_via_business:
    ask: ''
    kind: derived
    origin: templates_file
    template_neg: Việc đóng bảo hiểm xã hội không thực hiện trực tiếp hoặc thông qua
      doanh nghiệp, hộ kinh doanh.
    template_pos: Việc đóng bảo hiểm xã hội được thực hiện trực tiếp hoặc thông qua
      doanh nghiệp, hộ kinh doanh.
  contribution_method_monthly:
    ask: ''
    kind: derived
    origin: templates_file
    template_neg: Bảo hiểm xã hội không đóng theo phương thức hằng tháng.
    template_pos: Bảo hiểm xã hội được đóng theo phương thức hằng tháng.
  contribution_method_periodic_or_contract_lump_sum:
    ask: ''
    kind: derived
    origin: templates_file
    template_neg: Bảo hiểm xã hội không đóng theo định kỳ hoặc một lần theo thời hạn
      hợp đồng.
    template_pos: Bảo hiểm xã hội được đóng theo định kỳ hoặc đóng trước một lần theo
      thời hạn hợp đồng.
  contribution_via_managing_agency:
    ask: ''
    kind: derived
    origin: templates_file
    template_neg: Bảo hiểm xã hội không đóng thông qua cơ quan quản lý.
    template_pos: Bảo hiểm xã hội được đóng thông qua cơ quan quản lý.
  covered_art2_k1_points_d_dd_e:
    ask: Bạn có phải là quân nhân, công an hoặc dân quân thường trực không?
    kind: input
    origin: templates_file
    template_neg: Người này không thuộc đối tượng tại điểm d, đ, e khoản 1 Điều 2
      Luật Bảo hiểm xã hội.
    template_pos: Người này thuộc đối tượng tại điểm d, đ hoặc e khoản 1 Điều 2 Luật
      Bảo hiểm xã hội (quân nhân, công an, dân quân thường trực).
  covered_art2_khoan1:
    ask: ''
    kind: derived
    origin: templates_file
    template_neg: Người này không thuộc đối tượng theo khoản 1 Điều 2 Luật Bảo hiểm
      xã hội.
    template_pos: Người này thuộc đối tượng tham gia bảo hiểm xã hội bắt buộc theo
      khoản 1 Điều 2 Luật Bảo hiểm xã hội.
  covered_art2_khoan2:
    ask: ''
    kind: derived
    origin: templates_file
    template_neg: Người lao động nước ngoài không thuộc đối tượng theo khoản 2 Điều
      2.
    template_pos: Người lao động nước ngoài thuộc đối tượng tham gia bảo hiểm xã hội
      bắt buộc theo khoản 2 Điều 2.
  covered_point_a:
    kind: derived
    template_neg: Người lao động không thuộc diện quy định tại điểm a khoản 1 Điều
      2 Luật BHXH.
    template_pos: Người lao động thuộc diện quy định tại điểm a khoản 1 Điều 2 Luật
      BHXH.
  covered_point_b:
    ask: Người lao động có thuộc diện quy định tại điểm b khoản 1 Điều 2 Luật BHXH
      không?
    kind: derived
    template_neg: Người lao động không thuộc diện quy định tại điểm b khoản 1 Điều
